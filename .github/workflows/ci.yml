name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: 平台单测（Python 3.12）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-platform
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --default-authentication-plugin=mysql_native_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-platform/requirements.lock
      - name: 安装依赖
        run: pip install -r requirements.lock
      - name: 建会话测试库
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS chat_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
      - name: 单元测试
        run: python -m pytest tests -q
        env:
          PYTHONPATH: src
          CHAT_DB_NAME: chat_test
          CHAT_DB_USER: root
          CHAT_DB_PASSWORD: root

  java:
    name: 产物骨架编译（Java 21）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-skeleton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: 编译
        run: mvn -B -q package -DskipTests
