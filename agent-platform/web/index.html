<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SysCraft 平台</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #e3e6ea; --ink: #1f2329;
    --ink-2: #646a73; --accent: #3370ff; --accent-soft: #eaf1ff;
    --ok: #2ea121; --warn-bg: #fff7e6; --warn-line: #ffd591;
    --err-bg: #fff1f0; --err-line: #ffa39e; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; }

  /* ---- 登录 ---- */
  #login { margin: auto; background: var(--panel); padding: 40px 44px; border-radius: 14px;
           box-shadow: 0 8px 30px rgba(0,0,0,.08); width: 360px; }
  #login h1 { font-size: 20px; margin-bottom: 6px; }
  #login p { color: var(--ink-2); margin-bottom: 22px; font-size: 13px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button { cursor: pointer; border: none; border-radius: 8px; font-size: 14px; }
  .btn-primary { width: 100%; padding: 10px; background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  #loginError { color: #d4380d; font-size: 12px; min-height: 18px; margin-top: 8px; }

  /* ---- 主界面 ---- */
  #main { display: none; flex: 1; width: 100%; }
  aside { width: 240px; background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; }
  .brand { padding: 16px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .brand small { display: block; color: var(--ink-2); font-weight: 400; }
  .side-actions { padding: 10px; }
  .side-actions button { width: 100%; padding: 8px; background: var(--accent-soft); color: var(--accent); }
  #sessionList { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .session-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex;
                  justify-content: space-between; align-items: center; gap: 6px; }
  .session-item:hover { background: var(--bg); }
  .session-item.active { background: var(--accent-soft); }
  .session-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .del { color: var(--ink-2); font-size: 12px; padding: 0 4px; }
  .session-item .del:hover { color: #d4380d; }
  .user-bar { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2);
              display: flex; justify-content: space-between; align-items: center; }
  .user-bar button { background: none; color: var(--accent); font-size: 12px; }

  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 8%; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; }
  .row.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .row.assistant .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
  .row.assistant .bubble.error { background: var(--err-bg); border-color: var(--err-line); }

  .thought { color: var(--ink-2); font-size: 12px; padding-left: 6px; }
  .thought::before { content: "⚙ "; }
  table.card { border-collapse: collapse; background: var(--panel); border-radius: var(--radius);
               overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); font-size: 13px; }
  table.card th { background: #f0f2f5; text-align: left; padding: 7px 12px; font-weight: 600; }
  table.card td { padding: 7px 12px; border-top: 1px solid var(--line); }
  .table-note { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .plan-card, .confirm-card { background: var(--warn-bg); border: 1px solid var(--warn-line);
        border-radius: var(--radius); padding: 12px 14px; max-width: 78%; white-space: pre-wrap; }
  .confirm-card button { margin-top: 8px; padding: 6px 18px; background: var(--accent); color: #fff; }
  .phase-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
                 padding: 10px 14px; max-width: 78%; font-size: 13px; }
  .phase-line { display: flex; gap: 8px; align-items: baseline; }
  .phase-line .mark { font-weight: 600; }
  .phase-line .mark.ok { color: var(--ok); } .phase-line .mark.fail { color: #d4380d; }
  .phase-line .detail { color: var(--ink-2); }
  .phase-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .generating-tip { color: var(--ink-2); font-size: 12px; }
  .cancel-btn { font-size: 12px; padding: 3px 12px; background: var(--err-bg);
                color: #d4380d; border: 1px solid var(--err-line); }
  .cancel-btn:disabled { opacity: .5; cursor: default; }
  .sub-block { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .sub-block .sub-title { font-size: 12px; color: var(--ink-2); margin-bottom: 3px; }
  .file-list { font-size: 12px; color: var(--ink-2); line-height: 1.7; }
  .file-list .more { color: var(--accent); cursor: pointer; }
  .log-list { font: 11px/1.6 "SF Mono", Menlo, Consolas, monospace; color: var(--ink-2);
              background: #f7f8fa; border-radius: 6px; padding: 6px 8px;
              max-height: 140px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .capability-card { background: var(--accent-soft); border: 1px solid var(--line);
                     border-radius: var(--radius); padding: 10px 14px; max-width: 78%;
                     font-size: 13px; color: var(--ink); }

  /* ---- 输入区 ---- */
  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 8%; display: flex; gap: 10px; }
  .composer input { flex: 1; }
  .composer button { padding: 0 22px; background: var(--accent); color: #fff; }
  .composer button:disabled { opacity: .55; cursor: default; }
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: #333;
           color: #fff; padding: 8px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 9; }
</style>
</head>
<body>

<div id="login">
  <h1>SysCraft 平台</h1>
  <p>说一句话，查数据；描述一个需求，生成一个系统。</p>
  <div class="field"><label>用户名</label><input id="username" autocomplete="username"></div>
  <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div>
  <button class="btn-primary" id="loginBtn">登 录</button>
  <div id="loginError"></div>
</div>

<div id="main">
  <aside>
    <div class="brand">SysCraft<small>自然语言 → 可运行系统</small></div>
    <div class="side-actions"><button id="newSession">＋ 新会话</button></div>
    <div id="sessionList"></div>
    <div class="user-bar"><span id="whoami"></span><button id="logout">退出</button></div>
  </aside>
  <div class="chat">
    <div id="messages"></div>
    <div class="composer">
      <input id="input" placeholder="查询数据，或描述一个要生成的系统…" maxlength="500">
      <button id="send">发送</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("token") || "";
let me = null;
let sessionId = sessionStorage.getItem("sessionId") || null;
let lastSeq = 0;            // 本轮已收到的最大事件序号，断线重连用它
let busy = false;           // 一轮交互进行中（含生成）

/* ---------------- 基础请求 ---------------- */
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showLogin(); throw new Error("登录已失效"); }
  const data = await res.json();
  if (data.code !== 0) throw new Error(data.msg || "请求失败");
  return data.data;
}
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 3500);
}

/* ---------------- 登录 ---------------- */
function showLogin() { $("login").style.display = "block"; $("main").style.display = "none"; }
function showMain() { $("login").style.display = "none"; $("main").style.display = "flex"; }

$("loginBtn").onclick = async () => {
  $("loginBtn").disabled = true; $("loginError").textContent = "";
  try {
    const data = await api("POST", "/api/auth/login",
      { username: $("username").value.trim(), password: $("password").value });
    token = data.token;
    sessionStorage.setItem("token", token);
    await enter();
  } catch (e) { $("loginError").textContent = e.message; }
  $("loginBtn").disabled = false;
};
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("logout").onclick = () => { token = ""; sessionId = null; sessionStorage.clear(); showLogin(); };

async function enter() {
  me = await api("GET", "/api/auth/me");
  $("whoami").textContent = me.username + " · " + (me.roleName || me.roleCode);
  showMain();
  await loadSessions();
  if (sessionId) await openSession(sessionId); else $("messages").innerHTML = "";
}

/* ---------------- 会话侧栏 ---------------- */
async function loadSessions() {
  const list = await api("GET", "/api/sessions");
  $("sessionList").innerHTML = "";
  for (const s of list) {
    const item = document.createElement("div");
    item.className = "session-item" + (s.sessionId === sessionId ? " active" : "");
    item.innerHTML = `<span class="title"></span><span class="del" title="删除会话">✕</span>`;
    item.querySelector(".title").textContent = s.title || "(未命名)";
    item.querySelector(".title").onclick = () => openSession(s.sessionId);
    item.querySelector(".del").onclick = async (ev) => {
      ev.stopPropagation();
      if (!confirm("删除会话「" + s.title + "」？记录不可恢复。")) return;
      await api("DELETE", "/api/sessions/" + s.sessionId);
      if (sessionId === s.sessionId) { sessionId = null; $("messages").innerHTML = ""; }
      loadSessions();
    };
    $("sessionList").appendChild(item);
  }
}
$("newSession").onclick = () => {
  sessionId = null; sessionStorage.removeItem("sessionId");
  document.querySelectorAll(".session-item").forEach(el => el.classList.remove("active"));
  $("messages").innerHTML = "";
  addBubble("user", "（新会话：查询数据，或直接描述一个要生成的系统）");
};

async function openSession(id) {
  sessionId = id; sessionStorage.setItem("sessionId", id);
  document.querySelectorAll(".session-item").forEach(el => el.classList.remove("active"));
  [...document.querySelectorAll(".session-item")].find(el =>
    el.querySelector(".title").onclick === undefined) ; // 样式在 loadSessions 里刷新
  const data = await api("GET", `/api/sessions/${id}/messages`);
  $("messages").innerHTML = "";
  for (const m of data.messages) renderMessage(m.role, m.type, m.content);
  scrollBottom();
  await loadSessions();
}

/* ---------------- 消息渲染 ---------------- */
function addBubble(role, text, isError) {
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "assistant");
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  bubble.textContent = text;
  row.appendChild(bubble); $("messages").appendChild(row); scrollBottom();
  return bubble;
}
function addNode(node) { $("messages").appendChild(node); scrollBottom(); return node; }
function scrollBottom() { $("messages").scrollTop = $("messages").scrollHeight; }

function renderTable(table) {
  const wrap = document.createElement("div");
  const t = document.createElement("table"); t.className = "card";
  const head = "<tr>" + table.columns.map(c => `<th>${esc(c.title)}</th>`).join("") + "</tr>";
  const body = table.rows.map(r => "<tr>" + table.columns.map(c => `<td>${esc(fmt(r[c.key]))}</td>`).join("") + "</tr>").join("");
  t.innerHTML = head + body;
  wrap.appendChild(t);
  if (table.total > table.rows.length) {
    const note = document.createElement("div"); note.className = "table-note";
    note.textContent = `共 ${table.total} 条，仅显示前 ${table.rows.length} 条`;
    wrap.appendChild(note);
  }
  addNode(wrap);
}
function fmt(v) { return v === null || v === undefined ? "" : String(v); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderMessage(role, type, content) {
  if (role === "user") { addBubble("user", typeof content === "string" ? content : JSON.stringify(content)); return; }
  if (type === "table") { /* 历史里的表格只存了统计，占位说明 */ 
    const note = document.createElement("div"); note.className = "thought";
    note.textContent = `（查询结果：${content.entity} 共 ${content.total} 条）`;
    addNode(note); return; }
  if (type === "plan") { const card = document.createElement("div"); card.className = "plan-card";
    card.textContent = content.summary; addNode(card); return; }
  if (type === "confirm") { renderConfirm(content.summary); return; }
  if (type === "error") { addBubble("assistant", content.message || content, true); return; }
  addBubble("assistant", typeof content === "string" ? content : JSON.stringify(content));
}

function renderConfirm(summary) {
  const card = document.createElement("div"); card.className = "confirm-card";
  card.textContent = summary;
  const btn = document.createElement("button"); btn.textContent = "确认执行";
  btn.onclick = () => { if (!busy) send("确认"); };
  card.appendChild(btn); addNode(card);
}

/* ---------------- SSE 流式对话 ---------------- */
$("send").onclick = () => send();
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) send(); });

async function send(text) {
  const message = (text ?? $("input").value).trim();
  if (!message || busy) return;
  $("input").value = "";
  addBubble("user", message);
  await streamChat(message, 0, 0);
}

async function streamChat(message, attempt, afterSeq) {
  busy = true; setSendDisabled(true);
  let phasePanel = null, phaseLines = {};
  try {
    const res = await fetch("/api/chat/stream?after_seq=" + afterSeq, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      toast(body.msg || `请求失败 (${res.status})`);
      if (res.status === 401) showLogin();
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    // 《技术栈》3.2：fetch + ReadableStream 自解析 SSE，令牌留在请求头里
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const blocks = buffer.split("\n\n");
      buffer = blocks.pop();
      for (const block of blocks) {
        const line = block.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const event = JSON.parse(line.slice(6));
        lastSeq = Math.max(lastSeq, event.seq || 0);
        if (!event.sessionId && sessionId === null) {} // 新会话 id 从 done 事件取
        const outcome = handleEvent(event, { phasePanel, phaseLines });
        phasePanel = outcome.phasePanel || phasePanel;
        phaseLines = outcome.phaseLines || phaseLines;
      }
    }
  } catch (err) {
    // 断线续传（设计 6.2）：不重发请求，带 seq 重连补发缺失事件
    if (attempt < 3) {
      addThought("连接中断，正在续传…");
      await new Promise(r => setTimeout(r, 800));
      return await streamChat(message, attempt + 1, lastSeq);
    }
    addBubble("assistant", "连接中断且续传失败，请刷新页面查看历史。", true);
  } finally {
    busy = false; setSendDisabled(false);
    if (sessionId === null) { /* done 事件里可能带来了新会话 id */ }
  }
}

function handleEvent(event, ctx) {
  switch (event.type) {
    case "thought": addThought(event.text); break;
    case "tool_result": if (!event.ok) addThought("工具调用失败"); break;
    case "table": renderTable(event.table); break;
    case "text": addBubble("assistant", event.text); break;
    case "confirm": renderConfirm(event.summary || event.text); break;
    case "error": addBubble("assistant", event.message, true); break;
    case "file": ensurePhasePanel(ctx); addFileLine(ctx, event.path); break;
    case "log": ensurePhasePanel(ctx); addLogLine(ctx, event.text); break;
    case "capability": renderCapabilityCard(event); break;
    case "phase": {
      ensurePhasePanel(ctx);
      const line = document.createElement("div"); line.className = "phase-line";
      line.innerHTML = `<span class="mark"></span><span class="step"></span><span class="detail"></span>`;
      const mark = line.querySelector(".mark");
      mark.textContent = event.ok ? "✓" : "✗";
      mark.className = "mark " + (event.ok ? "ok" : "fail");
      line.querySelector(".step").textContent = event.step;
      line.querySelector(".detail").textContent = event.detail || "";
      ctx.phasePanel.appendChild(line); scrollBottom();
      if (!event.ok) {
        // 失败或取消：不再允许取消，按钮退场
        const btn = ctx.phasePanel.querySelector(".cancel-btn");
        if (btn) btn.remove();
      }
      break;
    }
    case "done":
      if (event.sessionId && event.sessionId !== sessionId) {
        sessionId = event.sessionId; sessionStorage.setItem("sessionId", sessionId); loadSessions();
      }
      break;
  }
  return ctx;
}

function ensurePhasePanel(ctx) {
  if (ctx.phasePanel) return;
  ctx.phasePanel = document.createElement("div"); ctx.phasePanel.className = "phase-panel";
  const head = document.createElement("div"); head.className = "phase-head";
  const tip = document.createElement("div"); tip.className = "generating-tip";
  tip.textContent = "生成进行中，全程约 2 分钟；此期间查询不可用。";
  const btn = document.createElement("button"); btn.className = "cancel-btn"; btn.textContent = "取消生成";
  btn.onclick = () => cancelGeneration(btn);
  head.appendChild(tip); head.appendChild(btn);
  ctx.phasePanel.appendChild(head); addNode(ctx.phasePanel);
}

async function cancelGeneration(btn) {
  if (!confirm("确定取消本次生成？已完成步骤的产物会保留，需求不会上线。")) return;
  btn.disabled = true;
  try {
    await api("POST", "/api/generate/cancel");
    btn.textContent = "取消中…";
    toast("取消请求已发出，将在当前步骤结束后停止");
  } catch (e) {
    btn.disabled = false;
    toast(e.message);
  }
}

function addFileLine(ctx, path) {
  let block = ctx.phasePanel.querySelector(".file-block");
  if (!block) {
    block = document.createElement("div"); block.className = "sub-block file-block";
    block.innerHTML = `<div class="sub-title">产物文件</div><div class="file-list"></div>`;
    ctx.phasePanel.appendChild(block);
    ctx.fileLines = [];
  }
  if (!ctx.fileLines) ctx.fileLines = [];
  ctx.fileLines.push(path);
  const list = block.querySelector(".file-list");
  const LIMIT = 6;
  if (ctx.fileLines.length <= LIMIT) {
    const line = document.createElement("div"); line.textContent = "📄 " + path;
    list.appendChild(line);
  } else if (ctx.fileLines.length === LIMIT + 1) {
    const more = document.createElement("div"); more.className = "more";
    more.textContent = `…等 ${ctx.fileLines.length} 个文件，点击展开`;
    more.onclick = () => {
      list.innerHTML = "";
      ctx.fileLines.forEach(p => { const d = document.createElement("div"); d.textContent = "📄 " + p; list.appendChild(d); });
    };
    list.appendChild(more);
  } else {
    const more = list.querySelector(".more");
    if (more) more.textContent = `…等 ${ctx.fileLines.length} 个文件，点击展开`;
  }
  scrollBottom();
}

function addLogLine(ctx, text) {
  let block = ctx.phasePanel.querySelector(".log-block");
  if (!block) {
    block = document.createElement("div"); block.className = "sub-block log-block";
    block.innerHTML = `<div class="sub-title">编译 / 修复日志</div><div class="log-list"></div>`;
    ctx.phasePanel.appendChild(block);
  }
  const list = block.querySelector(".log-list");
  const line = document.createElement("div"); line.textContent = text;
  list.appendChild(line);
  while (list.children.length > 8) list.removeChild(list.firstChild);  // 只留尾部 8 条
  list.scrollTop = list.scrollHeight;
  scrollBottom();
}

function addThought(text) {
  const el = document.createElement("div"); el.className = "thought"; el.textContent = text;
  addNode(el);
}
function renderCapabilityCard(event) {
  const card = document.createElement("div");
  card.className = "capability-card";
  const names = (event.available || []).map(e => e.display).join("、") || "（暂无）";
  card.textContent = `当前能力范围：${names}。${event.hint || ""}`;
  addNode(card);
}
function setSendDisabled(disabled) {
  $("send").disabled = disabled;
  $("input").placeholder = disabled ? "处理中…" : "查询数据，或描述一个要生成的系统…";
}

/* ---------------- 启动 ---------------- */
(async function boot() {
  if (!token) { showLogin(); return; }
  try { await enter(); } catch (e) { showLogin(); }
})();
</script>
</body>
</html>
