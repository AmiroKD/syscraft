server:
  port: 8080

spring:
  application:
    name: syscraft-skeleton

  # 不设全局 SNAKE_CASE：契约里查询 DSL 的键是驼峰（orderBy / groupBy），
  # 只有数据字段是下划线（order_no）。全局改名会把 groupBy 变成 group_by，
  # 请求体里的分组条件就静默丢了。数据字段的命名由实体/VO 上的 @JsonProperty 决定。

  # 双库隔离（权限 6 节）：adm 存权限，biz 存业务。两个库各一个数据源，
  # 各一个 SqlSessionFactory，扫描入口见 AdmDataSourceConfig / BizDataSourceConfig。
  # Hikari 的字段名是 jdbc-url，写成 url 不会绑定。
  datasource:
    adm:
      jdbc-url: jdbc:mysql://127.0.0.1:3306/adm?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      # 账号口令只从环境变量取（源头是 ~/.adaptive/db.env，600，不在项目内）
      username: ${APP_USER:app}
      password: ${APP_PWD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: adm-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
    biz:
      jdbc-url: jdbc:mysql://127.0.0.1:3306/biz?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      username: ${APP_USER:app}
      password: ${APP_PWD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: biz-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  # 令牌走 Authorization 头，不落 Cookie：Python 侧只做透传，浏览器不直连 Spring
  token-name: Authorization
  token-prefix: Bearer
  timeout: 43200          # 12 小时
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  # JWT 签名密钥同样只从环境变量取；泄露即等同令牌可伪造
  jwt-secret-key: ${JWT_SECRET:}
  is-print: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不吐数据库连接串、磁盘路径这类内部信息
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    com.generated.platform: INFO

# 界面录入凭据的加密密钥（AES-256-GCM）。与数据库口令同源文件但绝不入库存明文
syscraft:
  secret: ${APP_SECRET:}
